spring.application.name=${APP_NAME:ORBIT}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/orbit;AUTO_SERVER=FALSE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

nexus.dispatch.batch-size=${NEXUS_DISPATCH_BATCH_SIZE:25}
nexus.cache.max-age-seconds=${NEXUS_CACHE_MAX_AGE_SECONDS:60}
management.endpoints.web.exposure.include=health,info
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,https://*.onrender.com}

# Render 15-minute inactivity keep-alive
orbit.keepalive.enabled=${ORBIT_KEEPALIVE_ENABLED:true}
orbit.keepalive.url=${RENDER_EXTERNAL_URL:https://nexus-api-cbql.onrender.com}
orbit.keepalive.interval-ms=${ORBIT_KEEPALIVE_INTERVAL_MS:600000}
